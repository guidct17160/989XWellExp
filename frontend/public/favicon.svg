      <stop offset="0%" stop-color="#E93B81" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <linearGradient id="favWave2" x1="0%" y1="0%" x2="100%" y2="0%">
